name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build g++ pkg-config
          libgl1-mesa-dev libegl1-mesa-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
          libxfixes-dev libxss-dev libxtst-dev
          libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev
          libasound2-dev libpulse-dev libudev-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build g++ pkg-config
          libgl1-mesa-dev libegl1-mesa-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
          libxfixes-dev libxss-dev libxtst-dev
          libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev
          libasound2-dev libpulse-dev libudev-dev

      - name: Configure
        run: cmake --preset sanitizers

      - name: Build
        run: cmake --build --preset sanitizers

      - name: Test
        run: ctest --preset sanitizers --output-on-failure

  windows-package:
    name: Windows x64 package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --parallel 2

      - name: Test portable systems
        run: ctest --preset windows-release --output-on-failure

      - name: Package
        run: >-
          cpack --config build/windows-release/CPackConfig.cmake
          -C Release -B dist

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $archive = "dist/GDP-Windows-x64.zip"
          if (-not (Test-Path $archive)) {
            throw "Windows package was not generated: $archive"
          }
          $destination = "dist/artifact"
          Expand-Archive -Path $archive -DestinationPath $destination
          $executable = Get-ChildItem $destination -Recurse -Filter gdp.exe |
            Select-Object -First 1
          $runtime = Get-ChildItem $destination -Recurse -Filter SDL3.dll |
            Select-Object -First 1
          if ($null -eq $executable -or $null -eq $runtime) {
            throw "Package must contain gdp.exe and SDL3.dll"
          }
          foreach ($type in @("worker", "guard", "officer", "engineer", "robot")) {
            $brain = Join-Path $executable.DirectoryName "ai/$type.brain"
            if (-not (Test-Path $brain)) {
              throw "Package is missing trained enemy brain: $brain"
            }
          }
          & $executable.FullName --headless --frames 3
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged headless smoke test failed with $LASTEXITCODE"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GDP-Windows-x64
          path: dist/artifact/**
          if-no-files-found: error
          retention-days: 30
