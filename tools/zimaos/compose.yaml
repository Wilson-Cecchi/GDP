name: gdp-training
services:
  trainer:
    image: gdp-training:training-v2-dc5f9444d733
    container_name: gdp-training
    restart: always
    user: "65534:65534"
    cpus: 0.75
    mem_limit: 512m
    memswap_limit: 1g
    pids_limit: 64
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    environment:
      GDP_POPULATION: "8"
      GDP_BATCH_GENERATIONS: "70"
      GDP_SEED: "20261001"
      GDP_COOLDOWN_MS: "1000"
      GDP_PAUSE_C: "80"
      GDP_RESUME_C: "70"
      GDP_WIDE_EVERY: "5"
    volumes:
      - ./data:/data
      - /sys:/host-sys:ro
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,os,sys,time; p='/data/status.json'; s=json.load(open(p)); sys.exit(0 if s.get('state') in ('running','cooling','thermal_paused') and time.time()-os.stat(p).st_mtime < 30 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
